<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Game Debug</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #game-box {
            position: relative;
            width: 320px;
            height: 400px;
            border: 3px solid #00d2ff;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        #controls {
            margin-top: 15px;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background: #00d2ff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            color: #ffeb3b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>เกมทดสอบ AR (เปิดกล้อง)</h2>

    <div id="game-box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="gameCanvas" width="320" height="400"></canvas>
    </div>

    <div id="controls">
        <button onclick="startCamera()">กดเพื่อเปิดกล้อง</button>
        <div id="status">สถานะ: รอการเปิดกล้อง...</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');

        let playerX = 160;
        let isCameraActive = false;

        // ฟังก์ชันเปิดกล้องแบบเสถียร
        async function startCamera() {
            statusText.innerText = "สถานะ: กำลังขอสิทธิ์เปิดกล้อง...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 320 }, height: { ideal: 400 }, facingMode: "user" },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();
                
                isCameraActive = true;
                statusText.innerText = "สถานะ: กล้องทำงานปกติ! (ลากเมาส์/แตะจอเพื่อขยับ)";
            } catch (err) {
                statusText.innerText = "เปิดกล้องไม่สำเร็จ: " + err.name + " - " + err.message;
                console.error(err);
            }
        }

        // ระบบควบคุมสำรอง (ใช้เมาส์/สัมผัส) กรณีกล้องไม่จับหน้า
        function handleMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            playerX = clientX - rect.left;
            if (playerX < 15) playerX = 15;
            if (playerX > canvas.width - 15) playerX = canvas.width - 15;
        }

        canvas.addEventListener('mousemove', (e) => handleMove(e.clientX));
        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) handleMove(e.touches[0].clientX);
        });

        // ลูปวาดหน้าจอเกม
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // วาดตัวละครผู้เล่น (วงกลมสีฟ้า)
            ctx.beginPath();
            ctx.arc(playerX, 350, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#00d2ff';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            requestAnimationFrame(drawGame);
        }

        drawGame();
    </script>
</body>
</html>
