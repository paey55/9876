<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Game: Head Motion Tracking</title>
    <!-- ดึงไลบรารี MediaPipe สำหรับตรวจจับใบหน้าผ่านกล้อง -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 480px;
            border: 4px solid #00d2ff;
            border-radius: 12px;
            overflow: hidden;
        }

        video { display: none; }

        canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* กลับข้างแบบกระจกเงา */
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 4px #000;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00d2ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="webcam" playsinline></video>
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <span id="scoreText">คะแนน: 0</span>
            <span>ขยับหัว ซ้าย-ขวา</span>
        </div>

        <div id="game-over-screen" style="display: none;">
            <h1 style="color: #ff4757;">GAME OVER!</h1>
            <p id="finalScore">คะแนนของคุณ: 0</p>
            <button onclick="restartGame()">เล่นอีกครั้ง</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('gameCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('finalScore');

        canvasElement.width = 360;
        canvasElement.height = 480;

        let playerX = canvasElement.width / 2;
        let score = 0;
        let isGameOver = false;
        let obstacles = [];

        // ตั้งค่าระบบตรวจจับใบหน้า (MediaPipe Face Mesh)
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        // เมื่อระบบตรวจจับใบหน้าได้ในแต่ละเฟรม
        faceMesh.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // วาดภาพจากกล้องลงบน Canvas
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // ดึงพิกัดใบหน้า
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                // ใช้พิกัดจุดปลายจมูก (Landmark หมายเลข 1) ในการระบุตำแหน่งหัว
                const nose = landmarks[1]; 
                
                // แปลงพิกัดจมูกเป็นตำแหน่ง X บนหน้าจอ
                playerX = nose.x * canvasElement.width;
            }

            if (!isGameOver) {
                // วาดตัวละครผู้เล่น (วงกลมสีฟ้า) ตามตำแหน่งหัว
                canvasCtx.beginPath();
                canvasCtx.arc(playerX, canvasElement.height - 50, 20, 0, Math.PI * 2);
                canvasCtx.fillStyle = '#00d2ff';
                canvasCtx.fill();
                canvasCtx.lineWidth = 3;
                canvasCtx.strokeStyle = 'white';
                canvasCtx.stroke();

                // จัดการสิ่งกีดขวาง
                updateObstacles();
            }

            canvasCtx.restore();
        });

        // ระบบกล้องวิดีโอ
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 360,
            height: 480
        });
        camera.start();

        function spawnObstacle() {
            if (isGameOver) return;
            const size = Math.random() * 30 + 20;
            const x = Math.random() * (canvasElement.width - size);
            obstacles.push({ x, y: -size, size, speed: Math.random() * 2 + 3 });
        }

        function updateObstacles() {
            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.y += obs.speed;

                // วาดกล่องสิ่งกีดขวางสีแดง
                canvasCtx.fillStyle = '#ff4757';
                canvasCtx.fillRect(obs.x, obs.y, obs.size, obs.size);

                // ตรวจจับการชนกันระหว่างวงกลมผู้เล่นกับกล่อง
                let dist = Math.hypot(playerX - (obs.x + obs.size/2), (canvasElement.height - 50) - (obs.y + obs.size/2));
                if (dist < 20 + obs.size/2) {
                    endGame();
                }

                // เมื่อสิ่งกีดขวางตกพ้นหน้าจอ
                if (obs.y > canvasElement.height) {
                    obstacles.splice(i, 1);
                    score += 10;
                    scoreText.innerText = `คะแนน: ${score}`;
                    i--;
                }
            }
        }

        function endGame() {
            isGameOver = true;
            finalScore.innerText = `คะแนนของคุณ: ${score}`;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            score = 0;
            obstacles = [];
            isGameOver = false;
            scoreText.innerText = `คะแนน: ${score}`;
            gameOverScreen.style.display = 'none';
        }

        setInterval(spawnObstacle, 1000);
    </script>
</body>
</html>
