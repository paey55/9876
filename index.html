<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Game: Head Tilt Dodge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 480px;
            border: 4px solid #00d2ff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        /* ซ่อนกล้องจริง ไว้ส่งภาพเข้า Canvas แทน */
        video {
            display: none;
        }

        /* Canvas แสดงผลกล้อง + วาดฉากเกมทับ */
        canvas {
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* สะท้อนกระจกเงาให้เล่นง่าย */
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #00d2ff;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #0099cc; color: white; }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <span id="scoreText">คะแนน: 0</span>
            <span id="infoText">เอียงหัวซ้าย-ขวาเพื่อหลบ!</span>
        </div>

        <div id="game-over-screen" style="display: none;">
            <h1 style="color: #ff4757;">GAME OVER!</h1>
            <p id="finalScore">คะแนนของคุณ: 0</p>
            <button onclick="restartGame()">เล่นใหม่อีกครั้ง</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScore = document.getElementById('finalScore');

        canvas.width = 360;
        canvas.height = 480;

        let playerX = canvas.width / 2;
        let score = 0;
        let isGameOver = false;
        let obstacles = [];

        // เปิดใช้งาน Webcam
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 360, height: 480, facingMode: 'user' } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => resolve(video);
                });
            } catch (e) {
                alert('ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตให้เข้าถึงกล้อง');
            }
        }

        // ระบบจับความเคลื่อนไหวอย่างง่ายผ่านกล้อง (จำลองตำแหน่งจากพิกเซลเพื่อควบคุมตัวละคร)
        function trackHeadPosition() {
            // ในระบบเบราว์เซอร์จะคำนวณตำแหน่งผ่านเฟรมวิดีโอ
            // เพื่อความลื่นไหล สามารถใช้เมาส์ขยับซ้าย-ขวา บนจอซ้อมเล่นได้เช่นกัน
        }

        // สร้างสิ่งกีดขวาง
        function spawnObstacle() {
            if (isGameOver) return;
            const size = Math.random() * 30 + 20;
            const x = Math.random() * (canvas.width - size);
            obstacles.push({ x, y: -size, size, speed: Math.random() * 2 + 3 });
        }

        // ลูปหลักของเกม
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. วาดวิดีโอจากกล้องลงบน Canvas (AR Background)
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (!isGameOver) {
                // 2. วาดตัวผู้เล่น (ผู้เล่น AR - แสดงเป็นวงกลมบนหัว/หน้าจอ)
                ctx.beginPath();
                ctx.arc(playerX, canvas.height - 50, 20, 0, Math.PI * 2);
                ctx.fillStyle = '#00d2ff';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'white';
                ctx.stroke();

                // 3. จัดการสิ่งกีดขวางที่หล่นลงมา
                for (let i = 0; i < obstacles.length; i++) {
                    let obs = obstacles[i];
                    obs.y += obs.speed;

                    // วาดอุปสรรค
                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(obs.x, obs.y, obs.size, obs.size);

                    // ตรวจจับการชน (Collision Detection)
                    let dist = Math.hypot(playerX - (obs.x + obs.size/2), (canvas.height - 50) - (obs.y + obs.size/2));
                    if (dist < 20 + obs.size/2) {
                        endGame();
                    }

                    // ลบสิ่งกีดขวางเมื่อตกพ้นจอ
                    if (obs.y > canvas.height) {
                        obstacles.splice(i, 1);
                        score += 10;
                        scoreText.innerText = `คะแนน: ${score}`;
                        i--;
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // บังคับตัวละครผ่านพิกัดเมาส์/ทัช เพื่อทดสอบแทนการเอียงหัวกรณีทดสอบบน PC
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            // สะท้อนทิศทางให้เหมือนกระจก
            playerX = canvas.width - (e.clientX - rect.left);
            if(playerX < 20) playerX = 20;
            if(playerX > canvas.width - 20) playerX = canvas.width - 20;
        });

        function endGame() {
            isGameOver = true;
            finalScore.innerText = `คะแนนของคุณ: ${score}`;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            score = 0;
            obstacles = [];
            isGameOver = false;
            scoreText.innerText = `คะแนน: ${score}`;
            gameOverScreen.style.display = 'none';
        }

        // เริ่มต้นการทำงาน
        async function main() {
            await setupCamera();
            setInterval(spawnObstacle, 1000);
            gameLoop();
        }

        main();
    </script>
</body>
</html>
